<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YBM IT 메인 리뉴얼 시안</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- ybmit.com 실제 DS 토큰 -->
  <link rel="stylesheet" href="https://www.ybmit.com/resources/css/ds/ybm-ds-tokens.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <!-- 상단 바 : 제목 + 시안 탭 -->
  <header class="viewer-bar">
    <h1 class="viewer-title">YBM IT 메인 리뉴얼 시안</h1>
    <div class="viewer-tabs" role="tablist" aria-label="시안 선택">
      <button type="button" class="viewer-tab is-active" role="tab" aria-selected="true" aria-controls="viewer-frame" data-src="main-e.html">
        시안 1
      </button>
      <button type="button" class="viewer-tab" role="tab" aria-selected="false" aria-controls="viewer-frame" data-src="main-g.html">
        시안 2
      </button>
    </div>
  </header>

  <!-- 선택한 시안 페이지 -->
  <main class="viewer-stage">
    <iframe class="viewer-frame" id="viewer-frame" src="main-e.html" title="선택한 시안 페이지"></iframe>
  </main>

  <script src="viewer.js"></script>
</body>
</html>
